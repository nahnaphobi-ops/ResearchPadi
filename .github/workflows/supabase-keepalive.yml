name: Supabase Keep Alive

on:
  schedule:
    # Free projects pause after ~7 days without activity. The API already
    # queries the database every 10 min while it is awake (/health/ready
    # self-ping); this is the twice-daily backup.
    - cron: '0 */12 * * *'
  workflow_dispatch:

env:
  PROJECT_REF: bpmfpxkuknchflpctmbr
  READY_URL: https://researchpadi.onrender.com/health/ready

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Restore the project if it is paused (needs SUPABASE_ACCESS_TOKEN)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN is not set; skipping the paused-project check."
            exit 0
          fi

          project_status() {
            curl -sS -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              "https://api.supabase.com/v1/projects/${PROJECT_REF}" \
              | python3 -c "import sys,json
          try:
              d = json.load(sys.stdin)
          except Exception:
              d = {}
          print(d.get('status', '') if isinstance(d, dict) else '')"
          }

          STATUS=$(project_status)
          echo "ResearchPadi status: ${STATUS:-<none>}"

          case "${STATUS}" in
            "")
              # An expired or revoked token returns an error body with no status.
              echo "::warning::Supabase Management API gave no project status. The SUPABASE_ACCESS_TOKEN secret is probably expired; create a new token (no expiry) at supabase.com/dashboard/account/tokens and update the repo secret."
              ;;
            INACTIVE|PAUSED*|GOING_DOWN)
              echo "Project inactive/paused — restoring..."
              curl -sS -X POST \
                -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
                -H "Content-Type: application/json" \
                "https://api.supabase.com/v1/projects/${PROJECT_REF}/restore" \
                -w "\nrestore HTTP %{http_code}\n"
              for i in $(seq 1 24); do
                sleep 10
                S=$(project_status)
                echo "  poll $i → ${S}"
                [ "$S" = "ACTIVE_HEALTHY" ] && break
              done
              ;;
            *)
              echo "Project is up (or coming up) — no restore needed"
              ;;
          esac

      - name: Query the database through the API (counts as activity)
        run: |
          set -uo pipefail
          # Wakes the Render service if it is asleep, and /health/ready runs a
          # small Supabase query. No secrets needed.
          for i in 1 2 3; do
            CODE=$(curl -sS -o /tmp/ready.json -w "%{http_code}" \
              --max-time 90 --connect-timeout 30 "$READY_URL" || echo "000")
            echo "Attempt $i → HTTP $CODE"
            head -c 300 /tmp/ready.json 2>/dev/null; echo
            [ "$CODE" = "200" ] && exit 0
            sleep 20
          done
          echo "::error::$READY_URL did not report the database as ready."
          exit 1
