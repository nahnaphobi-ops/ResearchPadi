name: Supabase Keep Alive

on:
  schedule:
    # Free projects pause after ~7 days idle. Daily ping + auto-restore.
    - cron: '0 */12 * * *'
  workflow_dispatch:

env:
  PROJECT_REF: bpmfpxkuknchflpctmbr
  PROJECT_URL: https://bpmfpxkuknchflpctmbr.supabase.co

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Check project + restore if paused
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "Missing secrets.SUPABASE_ACCESS_TOKEN (Supabase personal access token sbp_...)"
            exit 1
          fi

          STATUS=$(curl -sS \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}" \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('status',''))")

          echo "ResearchPadi status: ${STATUS}"

          case "${STATUS}" in
            ACTIVE_HEALTHY|ACTIVE_UNHEALTHY|COMING_UP|RESTORING|UNKNOWN)
              echo "Project is up (or coming up) — no restore needed"
              ;;
            INACTIVE|PAUSED*|GOING_DOWN)
              echo "Project inactive/paused — restoring..."
              curl -sS -X POST \
                -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
                -H "Content-Type: application/json" \
                "https://api.supabase.com/v1/projects/${PROJECT_REF}/restore" \
                -w "\nrestore HTTP %{http_code}\n"
              # Wait for DB to come back
              for i in $(seq 1 24); do
                sleep 10
                S=$(curl -sS \
                  -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
                  "https://api.supabase.com/v1/projects/${PROJECT_REF}" \
                  | python3 -c "import sys,json; print(json.load(sys.stdin).get('status',''))")
                echo "  poll $i → $S"
                if [ "$S" = "ACTIVE_HEALTHY" ]; then
                  break
                fi
              done
              ;;
            *)
              echo "Unexpected status: ${STATUS}"
              ;;
          esac

      - name: Ping project REST API (counts as activity)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          SERVICE_KEY=$(curl -sS \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/api-keys" \
            | python3 -c "import sys,json; keys=json.load(sys.stdin); print(next(k['api_key'] for k in keys if k.get('name')=='service_role' or k.get('id')=='service_role'))")

          CODE=$(curl -sS -o /tmp/sb-body.txt -w "%{http_code}" \
            --max-time 60 \
            "${PROJECT_URL}/rest/v1/users?select=id&limit=1" \
            -H "apikey: ${SERVICE_KEY}" \
            -H "Authorization: Bearer ${SERVICE_KEY}" \
            -H "Prefer: count=exact")

          echo "REST ping HTTP ${CODE}"
          head -c 200 /tmp/sb-body.txt || true
          echo
          if [ "${CODE}" != "200" ] && [ "${CODE}" != "206" ]; then
            exit 1
          fi
