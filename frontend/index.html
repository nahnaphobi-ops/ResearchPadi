    <!-- Splash loader: the logo-drawing intro plays while the app loads (see src/utils/splash.ts) -->
    <style>
      html:has(#splash) {
        overflow: hidden;
      }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        /* Brand blue, the same as the video's background, theme-color and the iOS launch images */
        background: #3b6eff;
        transition: opacity 0.45s ease, visibility 0.45s;
      }
      #splash.splash-out {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #splash video {
        width: min(80vw, 368px);
        aspect-ratio: 1;
        /* Feather the edges so the video melts into the background even if the decoder's blue is a shade off */
        -webkit-mask-image: linear-gradient(to right, transparent, #000 7%, #000 93%, transparent),
          linear-gradient(to bottom, transparent, #000 7%, #000 93%, transparent);
        -webkit-mask-composite: source-in;
        mask-image: linear-gradient(to right, transparent, #000 7%, #000 93%, transparent),
          linear-gradient(to bottom, transparent, #000 7%, #000 93%, transparent);
        mask-composite: intersect;
      }
      /* Shown only if the intro finishes before the app is ready (slow networks) */
      #splash .splash-bar {
        position: relative;
        width: 96px;
        height: 3px;
        margin-top: 8px;
        overflow: hidden;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.25);
        opacity: 0;
        transition: opacity 0.3s ease;
      }
      #splash .splash-bar::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: inherit;
        background: #ffffff;
        animation: splash-bar 1.1s ease-in-out infinite;
      }
      /* The delay keeps the bar from flashing when the app is already ready as the intro ends */
      #splash.splash-waiting:not(.splash-out) .splash-bar {
        opacity: 1;
        transition-delay: 0.4s;
      }
      @keyframes splash-bar {
        from { transform: translateX(-100%); }
        to { transform: translateX(250%); }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Loading ResearchPadi">
      <video
        src="/src/assets/splash/logo-draw.mp4"
        poster="/src/assets/splash/logo-draw-poster.webp"
        muted
        playsinline
        preload="none"
      ></video>
      <div class="splash-bar" aria-hidden="true"></div>
    </div>
    <script>
      // Runs before first paint. The intro plays once per browser session; later loads
      // (refreshes, new links in the same tab) and reduced-motion users go straight in.
      (function () {
        var splash = document.getElementById('splash');
        var video = splash.querySelector('video');
        var seen = false;
        try { seen = sessionStorage.getItem('rp-splash-seen') === '1'; } catch (e) {}
        var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (seen || reduce) { splash.remove(); return; }
        try { sessionStorage.setItem('rp-splash-seen', '1'); } catch (e) {}
        splash.dataset.state = 'playing';
        function done() {
          if (splash.dataset.state === 'done') return;
          splash.dataset.state = 'done';
          splash.dispatchEvent(new Event('splashdone'));
        }
        video.addEventListener('ended', function () {
          splash.classList.add('splash-waiting');
          done();
        });
        video.addEventListener('error', done);
        video.preload = 'auto';
        var playing = video.play();
        // Autoplay can be blocked (e.g. iOS Low Power Mode): don't hold the app back for it
        if (playing && playing.catch) playing.catch(done);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
