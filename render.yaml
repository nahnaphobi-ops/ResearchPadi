services:
  - type: web
    name: researchpadi-backend
    runtime: docker
    branch: main
    # Starter = always-on (no 15-min sleep). Requires a Render payment method.
    # If billing isn't set up, change this back to "free" in the Dashboard.
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /health/live
    envVars:
      - key: ADMIN_MFA
        value: "false"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: FRONTEND_URL
        value: https://researchpadi.onrender.com
      - key: SUPABASE_PROJECT_REF
        value: bpmfpxkuknchflpctmbr
      - key: SUPABASE_URL
        value: https://bpmfpxkuknchflpctmbr.supabase.co
      # Set secrets in the Render Dashboard. Do not commit live credentials.
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SUPABASE_ACCESS_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: PERPLEXITY_API_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: METRICS_TOKEN
        sync: false
      - key: ALLOW_DEMO_LOGIN
        value: "false"
