services:
  - type: web
    name: researchpadi-backend
    runtime: docker
    branch: main
    # Starter = always-on (no 15-min sleep). Requires a Render payment method.
    # If billing isn't set up, change this back to "free" in the Dashboard.
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: FRONTEND_URL
        value: https://researchpadi.vercel.app
      - key: SUPABASE_PROJECT_REF
        value: bpmfpxkuknchflpctmbr
      - key: SUPABASE_URL
        value: https://bpmfpxkuknchflpctmbr.supabase.co
      # Set secrets in the Render Dashboard. Do not commit live credentials.
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      # Phones (comma-separated) that may open /admin after the normal SMS login.
      - key: ADMIN_PHONE
        sync: false
      - key: ARKESEL_API_KEY
        sync: false
      - key: ARKESEL_SENDER_ID
        value: RsrchPadi
      - key: SUPABASE_ACCESS_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: PERPLEXITY_API_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      # Shared with Vercel: proves /api requests came through the Vercel proxy,
      # so the backend can trust the visitor IP it forwards (lib/client-ip.ts).
      - key: API_PROXY_SECRET
        sync: false
      - key: METRICS_TOKEN
        sync: false
      - key: ALLOW_DEMO_LOGIN
        value: "false"
